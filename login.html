<style>
  .auth-section {
    position: relative;
    padding: var(--space-2xl) 0;
    min-height: 100vh;
    background-image: linear-gradient(180deg, rgba(18, 12, 8, 0.72) 0%, rgba(18, 12, 8, 0.88) 100%), url('assets/images/auth/login-bg.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
  }

  [data-theme="light"] .auth-section {
    background-image: linear-gradient(180deg, rgba(30, 20, 12, 0.65) 0%, rgba(18, 12, 8, 0.82) 100%), url('assets/images/auth/login-bg.png');
  }

  .auth-card-wrap {
    max-width: 520px;
    margin: 0 auto;
    background: rgba(28, 20, 14, 0.85);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(212, 163, 89, 0.35);
    border-radius: var(--radius-lg);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6), 0 0 35px rgba(212, 163, 89, 0.15);
    overflow: hidden;
  }

  [data-theme="light"] .auth-card-wrap {
    background: rgba(253, 250, 246, 0.92);
    border: 1px solid rgba(180, 130, 70, 0.35);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.4);
  }

  .auth-tabs {
    display: flex;
    border-bottom: 1px solid var(--border-subtle);
    background: var(--bg-surface-alt);
  }
  .auth-tab-btn {
    flex: 1;
    padding: 1.1rem var(--space-sm);
    background: transparent;
    border: none;
    font-family: var(--font-display);
    font-size: var(--fs-md);
    font-weight: 600;
    color: var(--text-muted);
    cursor: pointer;
    transition: all var(--transition-base);
    text-align: center;
    border-bottom: 2px solid transparent;
  }
  .auth-tab-btn.active {
    color: var(--text-primary);
    background: var(--bg-surface);
    border-bottom-color: var(--color-secondary);
  }
  .auth-body {
    padding: var(--space-lg) var(--space-md);
  }
  .auth-tab-panel {
    display: none;
  }
  .auth-tab-panel.active {
    display: block;
  }
  .password-wrap {
    position: relative;
  }
  .toggle-pw-btn {
    position: absolute;
    top: 50%;
    right: 0.75rem;
    transform: translateY(-50%);
    background: transparent;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 0.25rem;
  }
  [dir="rtl"] .toggle-pw-btn {
    right: auto;
    left: 0.75rem;
  }
  .social-divider {
    display: flex;
    align-items: center;
    text-align: center;
    margin: var(--space-md) 0 var(--space-sm);
    color: var(--text-muted);
    font-size: var(--fs-xs);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .social-divider::before,
  .social-divider::after {
    content: '';
    flex: 1;
    border-bottom: 1px solid var(--border-subtle);
  }
  .social-divider span {
    padding: 0 0.85rem;
  }
  .social-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    width: 100%;
    padding: 0.65rem 1rem;
    border-radius: var(--radius-pill);
    border: 1px solid var(--border-subtle);
    background: var(--bg-surface-alt);
    color: var(--text-primary);
    font-size: var(--fs-sm);
    font-weight: 500;
    transition: all var(--transition-base);
    cursor: pointer;
  }
  .social-btn:hover {
    border-color: var(--color-secondary);
    background: var(--bg-surface);
  }
</style>

<main id="main-content">

    <div class="container-custom w-100">
      <div class="auth-card-wrap reveal-up">
        
        <!-- Standalone Login Header Toolbar -->

          <a href="index.html" class="brand-logo d-inline-flex align-items-center justify-content-center text-decoration-none">

        <div class="auth-body">

                  </button>

                    Remember me

                </div>

              </div>

              <button type="submit" class="btn-custom btn-primary-custom w-100 mb-3">Sign In to Aldergate</button>

            <div class="social-divider">

                <label for="reg-email" class="form-label">Email Address *</label>

                Continue with Facebook
              </button>

                Continue with Apple

            </div>
          </div>

          <!-- Success Alert Container -->
          <div class="form-success text-center p-4" id="auth-success" style="display:none;">
            <svg class="text-success mb-3" xmlns="http://www.w3.org/2000/svg" width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
            <h4 class="mb-2">Welcome to Aldergate Books</h4>
            <p class="text-secondary small mb-3" id="auth-success-msg">You have successfully signed in.</p>
            <a href="index.html" class="btn-custom btn-secondary-custom btn-sm-custom">Return to Homepage</a>
          </div>

        </div>
      </div>
    </div>
  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="assets/js/animations.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  // Tabs
  var tabBtns = document.querySelectorAll(".auth-tab-btn");
  var panels = document.querySelectorAll(".auth-tab-panel");

  tabBtns.forEach(function (btn) {
    btn.addEventListener("click", function () {
      var target = this.getAttribute("data-tab");
      tabBtns.forEach(function (b) { b.classList.remove("active"); });
      panels.forEach(function (p) { p.classList.remove("active"); });
      this.classList.add("active");
      document.getElementById("panel-" + target).classList.add("active");
    });
  });

  // Password toggle
  document.querySelectorAll(".toggle-pw-btn").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var targetId = this.getAttribute("data-target");
      var input = document.getElementById(targetId);
      if (!input) return;
      if (input.type === "password") {
        input.type = "text";
      } else {
        input.type = "password";
      }
    });
  });

  // Form submits
  var signinForm = document.getElementById("signin-form");
  if (signinForm) {
    signinForm.addEventListener("submit", function (e) {
      e.preventDefault();
      document.getElementById("signin-form").style.display = "none";
      var panelSignin = document.getElementById("panel-signin");
      panelSignin.querySelectorAll(".social-divider, .social-btn").forEach(function(el) {
        if (el.parentElement && el.parentElement.classList.contains("d-flex")) {
          el.parentElement.style.display = "none";
        }
        el.style.display = "none";
      });
      var successEl = document.getElementById("auth-success");
      document.getElementById("auth-success-msg").textContent = "You are now logged in. Enjoy your reading session!";
      successEl.style.display = "block";
    });
  }

  var registerForm = document.getElementById("register-form");
  if (registerForm) {
    registerForm.addEventListener("submit", function (e) {
      e.preventDefault();
      document.getElementById("register-form").style.display = "none";
      var panelRegister = document.getElementById("panel-register");
      panelRegister.querySelectorAll(".social-divider, .social-btn").forEach(function(el) {
        if (el.parentElement && el.parentElement.classList.contains("d-flex")) {
          el.parentElement.style.display = "none";
        }
        el.style.display = "none";
      });
      var successEl = document.getElementById("auth-success");
      document.getElementById("auth-success-msg").textContent = "Your account has been created. Welcome to the reader family!";
      successEl.style.display = "block";
    });
  }
});
</script>
</body>
