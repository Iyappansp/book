<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — Aldergate Books</title>
<meta name="description" content="Create an account at Aldergate Books to track special orders, save reading lists, and manage event passes.">
<meta property="og:title" content="Create Account — Aldergate Books">
<meta property="og:description" content="Create an account at Aldergate Books to track special orders, save reading lists, and manage event passes.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="signup.html">
<link rel="icon" type="image/png" href="assets/favicon.png">

<script>
  (function() {
    var theme = localStorage.getItem('bookstore-theme') || 'light';
    document.documentElement.setAttribute('data-theme', theme);
    var dir = localStorage.getItem('bookstore-dir') || 'ltr';
    document.documentElement.setAttribute('dir', dir);
  })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/dark-mode.css">
<link rel="stylesheet" href="assets/css/rtl.css">
<link rel="stylesheet" href="assets/css/responsive.css">
<link rel="stylesheet" href="assets/css/inner-pages.css">

<style>
  .auth-section {
    background-image: linear-gradient(180deg, rgba(18, 12, 8, 0.72) 0%, rgba(18, 12, 8, 0.88) 100%), url('assets/images/auth/login-bg.png');
  }
  [data-theme="light"] .auth-section {
    background-image: linear-gradient(180deg, rgba(30, 20, 12, 0.65) 0%, rgba(18, 12, 8, 0.82) 100%), url('assets/images/auth/login-bg.png');
  }
</style>
</head>
<body>
<a href="#main-content" class="skip-link">Skip to content</a>

<!-- Page-Level Top Right Corner Controls -->
<div class="page-top-toggles">
  <button type="button" class="btn-rtl-toggle" id="rtl-toggle" aria-label="Toggle layout direction" title="Toggle RTL Layout">
    <span class="rtl-text">RTL</span>
  </button>
  <button type="button" class="icon-toggle" id="theme-toggle" aria-label="Toggle dark mode" title="Toggle theme">
    <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="16" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="16" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>
</div>

<main id="main-content">

  <section class="auth-section min-vh-100 d-flex align-items-center">
    <div class="container-custom w-100">
      <div class="auth-card-wrap reveal-up">

        <div class="auth-header-bar d-flex align-items-center justify-content-center p-3 border-bottom bg-surface-alt">
          <a href="index.html" class="brand-logo d-inline-flex align-items-center justify-content-center text-decoration-none">
            <img src="assets/log2o.png" alt="Aldergate Books" class="brand-logo-img">
          </a>
        </div>

        <div class="auth-body">
          <div class="auth-heading">
            <span class="eyebrow">Welcome</span>
          </div>

          <form id="register-form" novalidate>
            <div class="mb-3">
              <label for="reg-name" class="form-label">Full Name *</label>
              <input type="text" class="form-control" id="reg-name" placeholder="Eleanor Vance" required>
            </div>

            <div class="mb-3">
              <label for="reg-email" class="form-label">Email Address *</label>
              <input type="email" class="form-control" id="reg-email" placeholder="eleanor@example.com" required>
            </div>

            <div class="mb-3">
              <label for="reg-password" class="form-label">Password *</label>
              <div class="password-wrap">
                <input type="password" class="form-control" id="reg-password" placeholder="At least 8 characters" required>
                <button type="button" class="toggle-pw-btn" data-target="reg-password" aria-label="Toggle password visibility">
                  <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
            </div>

            <div class="form-check mb-4">
              <input class="form-check-input" type="checkbox" id="terms-agree" required>
              <label class="form-check-label text-secondary small" for="terms-agree">
                I agree to the <a href="faq.html" class="text-decoration-underline text-secondary">Terms of Reading Service</a> &amp; Privacy Curation.
              </label>
            </div>

            <div class="auth-btn-row">
              <button type="submit" class="btn-custom btn-primary-custom">Create Reader Account</button>
            </div>
          </form>

          <div class="social-divider">
            <span>Or sign in with</span>
          </div>

          <div class="auth-social-list">
            <button type="button" class="social-btn social-btn-google" onclick="alert('Google Auth demo integration triggered.');">
              <svg width="18" height="18" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/></svg>
              Continue with Google
            </button>
            <button type="button" class="social-btn social-btn-facebook" onclick="alert('Facebook Auth demo integration triggered.');">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
              Continue with Facebook
            </button>
            <button type="button" class="social-btn social-btn-apple" onclick="alert('Apple Auth demo integration triggered.');">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.68-.83 1.14-1.99.98-3.15-.98.04-2.17.65-2.87 1.48-.63.74-1.18 1.93-.99 3.06 1.1.08 2.22-.56 2.88-1.39z"/></svg>
              Continue with Apple
            </button>
          </div>

          <div class="auth-alt-block">
            <p class="auth-switch-note">
              Already have an account?
              <a href="login.html" class="auth-switch-link">Sign In</a>
            </p>
          </div>

          <div class="form-success text-center p-4" id="auth-success" style="display:none;">
            <svg class="text-success mb-3" xmlns="http://www.w3.org/2000/svg" width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
            <h4 class="mb-2">Welcome to Aldergate Books</h4>
            <p class="text-secondary small mb-3" id="auth-success-msg">Your account has been created.</p>
            <a href="index.html" class="btn-custom btn-secondary-custom btn-sm-custom">Return to Homepage</a>
          </div>

        </div>
      </div>
    </div>
  </section>

</main>

<footer id="main-footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/animations.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  document.querySelectorAll(".toggle-pw-btn").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var targetId = this.getAttribute("data-target");
      var input = document.getElementById(targetId);
      if (!input) return;
      input.type = input.type === "password" ? "text" : "password";
    });
  });

  var registerForm = document.getElementById("register-form");
  if (registerForm) {
    registerForm.addEventListener("submit", function (e) {
      e.preventDefault();
      registerForm.style.display = "none";
      document.querySelectorAll(".social-divider, .auth-social-list, .auth-alt-block, .auth-heading").forEach(function (el) {
        el.style.display = "none";
      });
      var successEl = document.getElementById("auth-success");
      document.getElementById("auth-success-msg").textContent = "Your account has been created. Welcome to the reader family!";
      successEl.style.display = "block";
    });
  }
});
</script>
</body>
</html>
