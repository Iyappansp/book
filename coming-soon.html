<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon — Aldergate Books</title>
<meta name="description" content="A new poetry and rare books reading room is coming soon to Aldergate Books. Sign up to be notified when it opens.">
<meta property="og:title" content="Coming Soon">
<meta property="og:description" content="A new poetry and rare books reading room is coming soon to Aldergate Books. Sign up to be notified when it opens.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="coming-soon.html">
<link rel="icon" type="image/png" href="assets/favicon.png">

<script>
  (function() {
    var theme = localStorage.getItem('bookstore-theme') || 'light';
    document.documentElement.setAttribute('data-theme', theme);
    var dir = localStorage.getItem('bookstore-dir') || 'ltr';
    document.documentElement.setAttribute('dir', dir);
  })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/dark-mode.css">
<link rel="stylesheet" href="assets/css/rtl.css">
<link rel="stylesheet" href="assets/css/responsive.css">
<link rel="stylesheet" href="assets/css/inner-pages.css">

</head>
<body>
<a href="#main-content" class="skip-link">Skip to content</a>

<header id="main-header"></header>

<main id="main-content">

  <section class="status-page-wrap">
    <div class="container-custom reveal-up">
      <span class="eyebrow" style="justify-content:center;">Opening Soon</span>
      <h1>A second reading room is on its way.</h1>
      <p>We're expanding into the space next door — a dedicated poetry and rare books room, opening this autumn.</p>

      <div class="countdown-row" id="countdown-row">
        <div class="countdown-block"><strong id="cd-days">00</strong><span>Days</span></div>
        <div class="countdown-block"><strong id="cd-hours">00</strong><span>Hours</span></div>
        <div class="countdown-block"><strong id="cd-minutes">00</strong><span>Minutes</span></div>
        <div class="countdown-block"><strong id="cd-seconds">00</strong><span>Seconds</span></div>
      </div>

      <form id="newsletter-form" class="mx-auto" style="max-width:420px;display:flex;gap:0.5rem;">
        <label for="cs-email" class="visually-hidden">Email address</label>
        <input type="email" id="cs-email" class="form-control" placeholder="you@example.com" required style="border-radius:var(--radius-pill);padding:0.75rem 1.1rem;border:1px solid var(--border-subtle);">
        <button type="submit" class="btn-custom btn-primary-custom">Notify Me</button>
      </form>
    </div>
  </section>

</main>

<footer id="main-footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/animations.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var target = new Date();
  target.setDate(target.getDate() + 62);

  function tick() {
    var now = new Date();
    var diff = Math.max(0, target - now);
    var days = Math.floor(diff / 86400000);
    var hours = Math.floor((diff % 86400000) / 3600000);
    var minutes = Math.floor((diff % 3600000) / 60000);
    var seconds = Math.floor((diff % 60000) / 1000);
    var d = document.getElementById("cd-days");
    var h = document.getElementById("cd-hours");
    var m = document.getElementById("cd-minutes");
    var s = document.getElementById("cd-seconds");
    if (d) d.textContent = String(days).padStart(2, "0");
    if (h) h.textContent = String(hours).padStart(2, "0");
    if (m) m.textContent = String(minutes).padStart(2, "0");
    if (s) s.textContent = String(seconds).padStart(2, "0");
  }
  tick();
  setInterval(tick, 1000);
});
</script>
</body>
</html>
